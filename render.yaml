# Blueprint do Render — sobe backend (FastAPI) e frontend (React) juntos.
# Para usar: Render -> New -> Blueprint -> conecte o repo IgorMoneta/SaaS-Academia.
# Ele cria automaticamente os dois serviços abaixo a partir da branch "main".

services:
  # ── Backend: API FastAPI + SQLite ────────────────────────────────
  - type: web
    name: fitsaas-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    branch: main
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: https://fitsaas-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  # ── Frontend: SPA React/Vite (build estático) ────────────────────
  - type: web
    name: fitsaas-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    branch: main
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fitsaas-backend.onrender.com
